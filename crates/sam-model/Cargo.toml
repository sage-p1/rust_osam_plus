[package]
name = "sam-model"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[dependencies]
osam_plus = { path = "../.." }
rand = "0.8"
# AES-128 as the PRF that derives each address's tree leaf (no position map).
aes = "0.9"
# SHA3-256 hashes AVL-tree keys exactly as Python's SmartAVLTree does.
sha3 = "0.10"
